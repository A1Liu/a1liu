name: Bootstrap

on:
  pull_request:
    paths:
      - bootstrap.sh
      - home-manager/**
      - nix/**
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

env:
  # The script clones this ref, so a PR tests its own version of everything.
  ALIU_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  vps:
    name: vps
    runs-on: ubuntu-latest

    # What the VPS runs, so the bootstrap gets tested as root in /root, which is
    # what the profile is written for.
    container: almalinux:9

    env:
      USER: root

    steps:
      # Nothing is installed first: tar, xz, git and the checkout are all the
      # script's job.
      - name: Bootstrap
        run: curl -fsSL "https://raw.githubusercontent.com/A1Liu/a1liu/$ALIU_REF/bootstrap.sh" | sh -s -- vps

      - name: Check the profile is usable
        run: |
          for bin in git gh jq node pnpm bun psql nvim rg; do
            /root/.nix-profile/bin/$bin --version
          done

  macos:
    name: macos
    runs-on: macos-latest

    steps:
      # The runner is neither `aliu` nor in /Users/aliu, so the profiles can be
      # built here but not activated.
      - name: Bootstrap
        run: curl -fsSL "https://raw.githubusercontent.com/A1Liu/a1liu/$ALIU_REF/bootstrap.sh" | sh -s -- macos --check
